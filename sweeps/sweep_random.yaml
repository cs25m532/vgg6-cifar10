program: train.py
method: random
metric:
  name: val_acc
  goal: maximize
parameters:
  activation:
    values: [relu, sigmoid, tanh, silu, gelu]
  optimizer:
    values: [sgd, nesterov, adam, adagrad, rmsprop, nadam]
  lr:
    values: [0.0003, 0.001, 0.003, 0.01, 0.03, 0.1]
  momentum:
    values: [0.0, 0.9]
  weight_decay:
    values: [0.0, 0.00005, 0.0005]
  batch_size:
    values: [64, 128, 256]
  epochs:
    values: [15, 20, 30]
