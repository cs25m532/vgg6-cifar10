program: train.py
method: grid
metric:
  name: val_acc
  goal: maximize
parameters:
  activation:
    value: relu
  optimizer:
    value: nesterov
  lr:
    values: [0.01, 0.05]
  momentum:
    value: 0.9
  weight_decay:
    value: 0.0005
  batch_size:
    values: [64, 128, 256]
  epochs:
    values: [10, 20, 30]
