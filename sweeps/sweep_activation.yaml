program: train.py
method: grid
metric:
  name: val_acc
  goal: maximize
parameters:
  activation:
    values: [relu, sigmoid, tanh, silu, gelu]
  optimizer:
    value: nesterov
  lr:
    value: 0.05
  momentum:
    value: 0.9
  weight_decay:
    value: 0.0005
  batch_size:
    value: 128
  epochs:
    value: 20
